[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jige"
version = "0.1.0"
description = "DataOps agent team for public genomics data (GDC/SRA/EGA) built on Claude Code + MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.20,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
dataops-mcp = "dataops_mcp.server:main"

[tool.setuptools]
packages = ["dataops_mcp"]

[tool.setuptools.package-data]
dataops_mcp = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: smoke tests that call the real GDC/ENA/NCBI/EGA APIs (pytest -m live)",
]

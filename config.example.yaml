# Jige example configuration
# install.sh copies this file to config.yaml. config.yaml is not committed to git (.gitignore).
# Relative paths are relative to the repository folder containing this file; ~ and $VAR are expanded.
# Put server names, user names, and absolute paths here only, never in code.

# ---------------------------------------------------------------- scheduler
scheduler: slurm            # slurm | pbs | local  (local = run on the current node without a scheduler)
partition: ""               # [FILL IN] e.g. normal   (queue name for PBS)
account: ""                 # [FILL IN] billing account, if any  (sbatch --account / qsub -A)
qos: ""                     # optional

# Where download jobs run, depending on whether compute nodes have internet access
#   compute : compute nodes have internet -> downloads are ordinary scheduler jobs
#   dtn     : a dedicated data-transfer partition/node exists -> submit to transfer_partition
#   login   : only login nodes have internet -> nohup background run on the login node
# How to check: on a compute node run  curl -sI https://api.gdc.cancer.gov/status
transfer_node_mode: compute # [FILL IN]
transfer_partition: ""      # required when transfer_node_mode=dtn

container: singularity      # singularity | apptainer | docker  (same as the nf-core -profile name)

# ---------------------------------------------------------------- paths
data_root: ./data           # [FILL IN] where downloads/results go (large storage recommended, e.g. /scratch/$USER/dataops)
work_dir: ./work            # [FILL IN] Nextflow work directory (scratch recommended)
state_dir: ./state          # request/job records (SQLite) and generated scripts. Home/local disk preferred over NFS/Lustre
singularity_cache: ./singularity_cache   # [FILL IN] container image cache (use the shared cache path if one exists)

# ---------------------------------------------------------------- credentials (paths only! never put their contents here)
# Keep both files at chmod 600. The tools never read file contents; they only pass the paths.
gdc_token_path: ~/.gdc/gdc-user-token.txt        # token from the GDC Data Portal (for controlled data)
ega_credentials_path: ~/.ega/credentials.json    # {"username": "...", "password": "..."}
dbgap_key_path: ""                               # repository key (.ngc) for protected dbGaP SRA runs, only if needed

# ---------------------------------------------------------------- resources/limits
max_concurrent_jobs: 4      # max number of concurrent jobs (also used for Nextflow executor.queueSize)
disk_headroom: 1.5          # required free disk space as a multiple of the download size
md5_inline_limit_gb: 20     # above this, md5 re-verification is generated as a separate job

transfer_job:               # download job resources
  cpus: 4
  mem: 8G
  time: "48:00:00"
  connections: 8            # gdc-client -n / pyega3 -c

nextflow_head_job:          # nextflow head job resources (Nextflow submits tasks separately)
  cpus: 2
  mem: 8G
  time: "120:00:00"

# commands prepended to every job script (environment modules, etc.)
module_loads: []
#  - module load java/17
#  - module load nextflow/25.10.4

# executable names/paths (use absolute paths if not on PATH)
tools:
  gdc_client: gdc-client
  pyega3: pyega3
  nextflow: nextflow

# path to an institution-wide Nextflow config, if any (added via includeConfig)
nextflow_extra_config: ""

# ---------------------------------------------------------------- pipelines (versions must be pinned as X.Y.Z)
# Latest releases as of 2026-10-30. All require Nextflow >= 25.10.4.
pipelines:
  fetchngs:
    version: "1.13.0"
    plugins: [nf-core-utils@0.5.0, nf-schema@2.7.3]
    default_params: {}
  rnaseq:
    version: "3.27.0"
    work_expansion: 3.0     # expected work directory size as a multiple of input size (heuristic for disk checks)
    plugins: [nf-schema@2.7.2]
    default_params: {}
  sarek:
    version: "3.11.0"
    work_expansion: 4.0
    plugins: [nf-core-utils@0.4.0, nf-fgbio@1.0.0, nf-prov@1.7.0, nf-schema@2.7.2]
    default_params: {}

# ---------------------------------------------------------------- references (local paths recommended)
# Use via prepare_pipeline(params={"reference": "<name>"}). Values under params are passed through as nf-core parameters.
# peer-reviewer uses assembly to compare against the reference of aligned BAMs.
references: {}
#  GRCh38_gencode_v44:
#    assembly: GRCh38
#    build: GRCh38
#    species: Homo sapiens
#    params:
#      fasta: /path/to/GRCh38.primary_assembly.genome.fa
#      gtf: /path/to/gencode.v44.primary_assembly.annotation.gtf
#  GRCh38_GDC:                       # for feeding GDC harmonized BAMs (GRCh38.d1.vd1) into sarek
#    assembly: GRCh38.d1.vd1
#    build: GRCh38
#    species: Homo sapiens
#    params:
#      fasta: /path/to/GRCh38.d1.vd1.fa
#      fasta_fai: /path/to/GRCh38.d1.vd1.fa.fai
#      dict: /path/to/GRCh38.d1.vd1.dict

# ---------------------------------------------------------------- HTTP
http:
  timeout: 60
  retries: 3
  contact_email: ""          # contact address attached to NCBI E-utilities requests (recommended)
  ncbi_api_key_env: NCBI_API_KEY   # NCBI API key is used if set in this environment variable
